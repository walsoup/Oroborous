name: Build Android APK (Expo)

on:
  workflow_dispatch:
  push:
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "metro.config.js"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "modules/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          npx expo prebuild --platform android
          node scripts/optimize-android.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK (release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --build-cache --parallel

      - name: Upload ARM64 Release APK (Tiny 11MB)
        uses: actions/upload-artifact@v4
        with:
          name: oroborous-arm64-v8a-release
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: oroborous-universal-release
          path: android/app/build/outputs/apk/release/app-universal-release.apk

      - name: Cache Puppeteer Browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            /tmp/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json', 'capture-screenshots.js') }}

      - name: Install Puppeteer in temp directory
        run: |
          if [ ! -d "/tmp/puppeteer/node_modules/puppeteer" ]; then
            mkdir -p /tmp/puppeteer
            cd /tmp/puppeteer
            npm init -y
            npm install puppeteer
          fi

      - name: Generate UI screenshots
        run: node capture-screenshots.js

      - name: Commit and push screenshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/
          git commit -m "chore: update UI screenshots [skip ci]" || echo "No changes to commit"
          git push || echo "Failed to push screenshots"
          
